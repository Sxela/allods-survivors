name: Release binaries
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.2.3 or 1.2.3-beta.1 (optional v prefix)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node tools/prepare-release.cjs "$RELEASE_VERSION" --check
      - run: npm ci
      - run: npm test

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set application version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node tools/prepare-release.cjs "$RELEASE_VERSION"
      - run: npm test
      - name: Build and audit package
        run: npm run desktop:dist -- --${{ matrix.platform }}
      - name: Collect release files
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir release-assets
          if [ "$BUILD_PLATFORM" = "win" ]; then
            cp dist/Allods-Survivors-win-x64.exe release-assets/
          else
            cp dist/Allods-Survivors-linux-x64.AppImage release-assets/
            cp dist/Allods-Survivors-linux-x64.tar.gz release-assets/
          fi
          cp dist/asset-report.json "release-assets/asset-report-$BUILD_PLATFORM.json"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release and calculate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -s Allods-Survivors-win-x64.exe
          test -s Allods-Survivors-linux-x64.AppImage
          test -s Allods-Survivors-linux-x64.tar.gz
          test -s asset-report-win.json
          test -s asset-report-linux.json
          sha256sum -- * > SHA256SUMS.txt
      - name: Create GitHub release and upload binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Allods Survivors $RELEASE_VERSION" \
            --generate-notes "${flags[@]}"
